<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1920"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="body" cx="50%" cy="58%" r="55%">
      <stop offset="0" stop-color="#1f1e26"/>
      <stop offset="1" stop-color="#060607"/>
    </radialGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc4ff"/>
      <stop offset="1" stop-color="#6656cc"/>
    </linearGradient>
    <radialGradient id="shine" cx="34%" cy="26%" r="40%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="512" cy="512" r="300"/></clipPath>
  </defs>
  <!-- macOS icon grid: 824px rounded square inside the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="512" cy="512" r="300" fill="url(#body)"/>
  <g clip-path="url(#ball)">
    <path d="M200 476 C 300 444, 400 508, 512 476 S 724 444, 824 476 V840 H200 Z" fill="url(#fill)"/>
    <path d="M200 476 C 300 444, 400 508, 512 476 S 724 444, 824 476" fill="none" stroke="#f1edff" stroke-width="7" stroke-opacity=".9"/>
  </g>
  <circle cx="512" cy="512" r="300" fill="url(#shine)"/>
  <circle cx="512" cy="512" r="297" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="6"/>
</svg>
