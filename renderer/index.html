<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <title>AI Terminal</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span>AI TERMINAL</div>
    <div class="top-status" id="topStatus"></div>
    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    </button>
  </header>

  <aside class="sidebar glass">
    <section class="side-section projects">
      <div class="section-head"><h2>Projects</h2><span class="count" id="projCount"></span></div>
      <input class="search" id="projSearch" type="search" placeholder="Search projects" aria-label="Search projects">
      <ul class="proj-list" id="projList"></ul>
    </section>
    <section class="side-section models">
      <div class="section-head"><h2>Models</h2><button class="link-btn" id="toolsRefresh" title="Check again">Check</button></div>
      <div id="modelCards"></div>
      <div class="sub-head">Installed local models</div>
      <ul class="ollama-list" id="ollamaList"></ul>
    </section>
  </aside>

  <main class="center">
    <nav class="tabbar" id="tabbar">
      <div class="tabs" id="tabs" role="tablist"></div>
      <button class="tab-action" id="splitBtn" title="Split view: open a second terminal beside this one" aria-label="Split view">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
      </button>
      <button class="tab-action" id="newBtn" title="New tab (Cmd+T)" aria-label="New tab">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>
    <div class="stage" id="stage">
      <div class="home" id="home"></div>
    </div>
  </main>

  <aside class="panel glass" id="panel">
    <section class="card" id="usageClaude"></section>
    <section class="card" id="usageCodex"></section>
    <section class="card" id="activity"></section>
    <section class="card" id="localCard"></section>
    <section class="card" id="systemCard"></section>
  </aside>

  <div class="modal-wrap" id="modal" hidden>
    <div class="modal glass" role="dialog" aria-modal="true" id="modalBody"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
