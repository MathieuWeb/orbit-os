<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <title>Orbit OS</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="dash">
  <aside class="nav">
    <div class="brand"><img class="brand-mark" src="logo.svg" alt=""><b>Orbit OS</b></div>

    <div class="nav-label">Workspace</div>
    <button class="nav-item" data-view="dash"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Dashboard</button>
    <button class="nav-item" data-view="term"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M7 10l3 2.5L7 15M12.5 15H17"/></svg>Terminals<span class="nav-count" id="tabCount"></span></button>

    <div class="nav-label">Tools</div>
    <button class="nav-item" id="navFinder"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2.5v3M15 2.5v3M9 18.5v3M15 18.5v3M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3"/></svg>Best local model</button>
    <button class="nav-item" id="navFree"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>Free up memory</button>
    <button class="nav-item" id="navNew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New terminal</button>

    <div class="nav-usage" id="usageWidget"></div>
    <div class="nav-widget" id="sysWidget"></div>

    <button class="nav-item" id="settingsBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</button>
  </aside>

  <header class="topbar">
    <div class="crumbs"><b>Orbit OS</b><span>/</span><span id="crumb">Dashboard</span><i class="crumb-dot"></i></div>
    <div class="top-status" id="topStatus"></div>
    <div class="model-pill" id="modelPill"></div>
  </header>

  <main class="view dash" id="dashboard">
    <div class="dash-inner">
      <section class="hero">
        <div class="hero-usage card">
          <div class="orb-cell" id="usageClaude"></div>
          <div class="orb-cell" id="usageCodex"></div>
          <div class="orb-cell" id="usageGemini"></div>
        </div>
        <div class="hero-models card">
          <div class="card-head"><span class="eyebrow-dot"></span><h2>AI models</h2><button class="link-btn" id="toolsRefresh" title="Check again">Check</button></div>
          <div id="modelCards"></div>
          <div class="sub-head">Installed local models</div>
          <ul class="ollama-list" id="ollamaList"></ul>
        </div>
      </section>

      <div class="headline" id="home"></div>

      <section class="grid3">
        <div class="card big" id="activity"></div>
        <div class="card big" id="localCard"></div>
        <div class="card big" id="systemCard"></div>
      </section>
    </div>
  </main>

  <main class="view term-view" id="termView">
    <div class="term-head">
      <button class="tab-action" id="projToggle" title="Show or hide projects" aria-label="Toggle projects"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <div class="tabs" id="tabs" role="tablist"></div>
      <button class="pill-btn" id="newBtn" title="New tab (Cmd+T)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New terminal</button>
      <span class="spacer"></span>
      <button class="pill-btn" id="splitBtn" title="Split view: open a second terminal beside this one (Cmd+D)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>Split view</button>
    </div>
    <div class="term-body">
      <aside class="projects" id="projPanel">
        <div class="section-head"><h3>Your projects</h3><span class="count" id="projCount"></span></div>
        <input class="search" id="projSearch" type="search" placeholder="Search projects" aria-label="Search projects">
        <ul class="proj-list" id="projList"></ul>
      </aside>
      <div class="stage" id="stage">
        <div class="empty-stage" id="emptyStage"></div>
      </div>
    </div>
  </main>

  <div class="modal-wrap" id="modal" hidden>
    <div class="modal glass" role="dialog" aria-modal="true" id="modalBody"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
